name: Release

on:
  release:
    types: [published] # 只在正式发布时触发，避免与 created / edited 产生并发冲突

# 确保同一个 Release 不会同时跑多个上传任务
concurrency:
  group: release-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  release:
    name: Upload Release Asset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Zip custom_components
        run: |
          cd custom_components/radar_map_manager
          zip -r ../../radar_map_manager.zip .

      - name: Upload Zip to Release
        uses: softprops/action-gh-release@v2
        with:
          files: radar_map_manager.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
